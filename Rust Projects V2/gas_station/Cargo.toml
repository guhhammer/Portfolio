[package]
name = "gas_station"
version = "0.4.0"
edition = "2024"

[dependencies]
rand = "0.8"
rocket = { version = "0.5.0", features = ["json", "tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = "3.1"
num-format = "0.4"
dotenv = "0.15"
log = "0.4"
fern = { version = "0.6", features = ["colored"] }
chrono = "0.4"
jsonwebtoken = "9.0" 
reqwest = "0.12.23"
regex = "1.11.2"
futures = "0.3.31"
argon2 = "0.5.3"
once_cell = "1.21.3"

[profile.release]
opt-level = "z"    # optimize for size
lto = true         # enable Link Time Optimization
codegen-units = 1  # better optimization, slightly slower compile
panic = 'abort'    # reduces binary size
