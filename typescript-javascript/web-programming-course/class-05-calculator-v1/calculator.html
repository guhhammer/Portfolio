<html>

	<head>

		<title>Calculator</title>

		
		<script type="text/javascript" src="javascript/jquery.js"></script>
		<script type="text/javascript" src="javascript/calculator.js"></script>
		<link rel="stylesheet" type="text/css" href="css/calculator.css">

	</head>

	<body>


		<div class="tbl">
			
			<table>
				
				<tr>
					
					<td><input type="text" id="sum1"></td>
					<td><input type="text" id="sum2"></td>
					<td><button id="sumr">+</button></td>

					<td><label class="sign">=</label></td>

					<td><input type="text" placeholder="Result" class="result" id="somRes"></td>
					<td><button class="clear" id="sumClear">Clear</button></td>


				</tr>

				<tr>

					<td><input type="text" id="subtraction1"></td>
					<td><input type="text" id="subtraction2"></td>
					<td><button id="subtrair">-</button></td>
					
					<td><label class="sign">=</label></td>

					<td><input type="text" placeholder="Result" class="result" id="subRes"></td>
					<td><button class="clear" id="subClear">Clear</button></td>

				</tr>

				<tr>

					<td><input type="text" id="multiplication1"></td>
					<td><input type="text" id="multiplication2"></td>
					<td><button id="multiplicar">*</button></td>

					<td><label class="sign">=</label></td>

					<td><input type="text" placeholder="Result" class="result" id="mulRes"></td>
					<td><button class="clear" id="mulClear">Clear</button></td>
					
				</tr>

				<tr>

					<td><input type="text" id="division1"></td>
					<td><input type="text" id="division2"></td>
					<td><button id="dividir">/</button></td>
					
					<td><label class="sign">=</label></td>

					<td><input type="text" placeholder="Result" class="result" id="divRes"></td>
					<td><button class="clear" id="divClear">Clear</button></td>

				</tr>

			</table>

		</div>

	</body>

</html>
