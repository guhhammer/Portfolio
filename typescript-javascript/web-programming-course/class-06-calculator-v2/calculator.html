

<html>

	<head>

		<title>Calculator</title>

		
		<script type="text/javascript" src="javascript/jquery.js"></script>
		<script type="text/javascript" src="javascript/calculator.js"></script>
		<link rel="stylesheet" type="text/css" href="css/calculator.css">

	</head>

	<body>


		<div class="tbl">
			
			<table>
				
				<tr>
					
					<td><input type="text" id="sum1"></td>
					<td>+</td>
					<td><input type="text" id="sum2"></td>
					<td><button id="sumr">Sumr</button></td>

				</tr>

				<tr>

					<td><input type="text" id="subtraction1"></td>
					<td>-</td>
					<td><input type="text" id="subtraction2"></td>
					<td><button id="subtrair">Subtrair</button></td>
					
				</tr>

				<tr>

					<td><input type="text" id="multiplication1"></td>
					<td>*</td>
					<td><input type="text" id="multiplication2"></td>
					<td><button id="multiplicar">Multiplicar</button></td>
					
				</tr>

				<tr>

					<td><input type="text" id="division1"></td>
					<td>/</td>
					<td><input type="text" id="division2"></td>
					<td><button id="dividir">Dividir</button></td>
					
				</tr>

			</table>

		</div>

	</body>

</html>
