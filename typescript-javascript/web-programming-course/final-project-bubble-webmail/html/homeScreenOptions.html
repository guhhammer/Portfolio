

<html>

	<head>

		<title>Blue Bubble</title>

		<meta charset="utf-8">

		<script type="text/javascript" src="../javascript/jquery.js"></script>
		<script type="text/javascript" src="../javascript/homeScreenOptions.js"></script>
		
		<link rel="stylesheet" type="text/css" href="../CSS/homeScreenOptions.css">
		<link rel="icon" type="text/css" href="../images/Blue Bubble Icon.jpg">

	</head>
	
	<body>

		<div id="update" class="posicionar">

			<table>
				
				<tr>
						
					<td colspan="2"><img src="../images/Blue Bubble Logo.png" id="logo"></td>
					<td></td>

				</tr>

				<tr>
						
					<td colspan="2" align="center"><button id="btRetroceder">Retroceder</button></td>
					<td></td>

				</tr>

				<tr>
						
					<td><button id="btCreate" align="center">Create account</button></td>
					<td><button id="btUpdate" align="center">Update Password</button></td>

				</tr>

			</table>

		</div>

		<div id="choseCreate">

			<table>
			
				<tr>
						
					<td colspan="2" align="center"><input type="text" id="Clogin" placeholder="Login"></td>
					<td></td>

				</tr>

				<tr>
						
					<td colspan="2" align="center"><input type="password" id="createPassword" placeholder="Password"></td>
					<td></td>

				</tr>

				<tr>
						
					<td colspan="2" align="center"><input type="password" id="createConfirmPassword" placeholder="Confirmar password"></td>
					<td></td>

				</tr>

				<tr>
					<td colspan="2" align="center"><button id="btCreateLogin"> Create Login </button></td>
					<td></td>
				</tr>

				<tr>
				
					<td colspan="2" align="center"><p id="createP">Passwords do not match!</p></td>
					<td></td>
				
				</tr>

			</table>

		</div>

		<div id="choseUpdate">

			<table>
			
				<tr>
						
					<td colspan="2" align="center"><input type="text" id="Alogin" placeholder="Login"></td>
					<td></td>

				</tr>

				<tr>
						
					<td colspan="2" align="center"><input type="password" id="updatePassword" placeholder="New Password"></td>
					<td></td>

				</tr>

				<tr>
						
					<td colspan="2" align="center"><input type="password" id="updateConfirmPassword" placeholder="Confirmar password"></td>
					<td></td>

				</tr>

				<tr>
					<td colspan="2" align="center"><button id="btUpdatePassword"> Update password </button></td>
					<td></td>
				</tr>

				<tr>
				
					<td colspan="2" align="center"><p id="updateP">Passwords do not match!</p></td>
					<td></td>
				
				</tr>

			</table>

		</div>


	</body>

</html>
