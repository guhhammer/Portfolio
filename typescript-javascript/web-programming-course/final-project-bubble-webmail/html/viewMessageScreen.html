<html>

	<head>

		<title>Blue Bubble</title>

		<meta charset="utf-8">

		<script type="text/javascript" src="../javascript/jquery.js"></script>
		<script type="text/javascript" src="../javascript/minimize.js?v=4"></script>
		<script type="text/javascript" src="../javascript/redirect.js?v=1"></script>
		<script type="text/javascript" src="../javascript/viewMessageScreen.js?v=4"></script>

		<link rel="stylesheet" type="text/css" href="../CSS/baseLayout.css?v=5">
		<link rel="stylesheet" type="text/css" href="../CSS/viewMessage.css?v=4">
		<link rel="icon" type="text/css" href="../images/Blue Bubble Icon.jpg">

	</head>

	<body>

		<div id="topoBarra">
			
			<table>
				
				<tr>

					<td>
						<button id="btRetornar"><img src="../images/logOut.png" id="btLogOut"></button>
					</td>


					<td>
						<button id="btRecolher"><img src="../images/menu.png" id="btMenu"></button>	
					</td>

					<td>
						<input type="text" placeholder="Search" id="searchBar" disabled>
					</td>

					<td>
						<button id="btSearch" disabled><img src="../images/lookFor.png" id="btLookFor"></button>
					</td>

					<td>
						<img src="../images/Blue Bubble Logo.png" id="logo">
					</td>

				</tr>

			</table>

		</div>

		<div id="inboxBar">
			
			<table>
				
				<tr>
					
					<td>
					
						<button id="btComposeMessage"> + New Message</button>

					</td>
					
					<td><p> Message view </p></td>

				</tr>

			</table>

		</div>


		<div id="guiaBarra"> 

			<table>
				
				<tr id="favorites">
				
					<td>
						<button id="primeiro" class="btRecolherGuia"><img src="../images/menu.png" class="btMenuSideBar"></button>
					</td>
				
					<td>
						<button id="btFavorites" class="guiaBarrabuttons"> Favorites </button>
					</td>

				</tr>

				<tr id="inbox">
				
					<td>
						<button id="segundo" class="btRecolherGuia"><img src="../images/menu.png" class="btMenuSideBar"></button>
					</td>
				
					<td>
						<button id="btInbox" class="guiaBarrabuttons"> Inbox </button>
					</td>

				</tr>

				<tr id="JunkMail">
				
					<td>
						<button id="terceiro" class="btRecolherGuia"><img src="../images/menu.png" class="btMenuSideBar"></button>
					</td>
				
					<td>
						<button id="btJunkMail" class="guiaBarrabuttons"> Junk Mail </button>
					</td>

				</tr>

				<tr id="Draft">
				
					<td>
						<button id="quarto" class="btRecolherGuia"><img src="../images/menu.png" class="btMenuSideBar"></button>
					</td>
				
					<td>
						<button id="btDrafts" class="guiaBarrabuttons"> Drafts </button>
					</td>

				</tr>

				<tr id="SentItems">
				
					<td>
						<button id="quinto" class="btRecolherGuia"><img src="../images/menu.png" class="btMenuSideBar"></button>
					</td>
				
					<td>
						<button id="btSentItems" class="guiaBarrabuttons"> Sent Items </button>
					</td>

				</tr>

				<tr id="DeletedItems">
				
					<td>
						<button id="sexto" class="btRecolherGuia"><img src="../images/menu.png" class="btMenuSideBar"></button>
					</td>
				
					<td>
						<button id="btDeletedItems" class="guiaBarrabuttons"> Deleted Items </button>
					</td>

				</tr>

				<tr id="Archive">
				
					<td>
						<button id="setimo" class="btRecolherGuia"><img src="../images/menu.png" class="btMenuSideBar"></button>
					</td>
				
					<td>
						
						<button id="btArchive" class="guiaBarrabuttons"> Archive </button>

					</td>

				</tr>

			</table>
			

		</div>

		<div id="viewMessages" class="withGuide_seeMessage">

			<table>

				<tr> 

					<td></td>

					<td><button id="btBack"> Back </button></td>

				</tr>

				<tr>
			
					<td></td>

					<td><button id="btDelete"> Delete Message </button></td>

				</tr>
				
				<tr>
					
					<td id="to"><p> To: </p></td>
					
					<td><input type="text" placeholder="recipient@bluebubble.com" id="emailRecipient" class=""></td>
				
				</tr>
				
				<tr>
					
					<td id="Cc"><p> Cc: </p></td>
					
					<td><input type="text" placeholder="you_@bluebubble.com" id="emailCc"></td>

				</tr>

				<tr>

					<td id="subject"><p> Subject: </p></td>
				
					<td><input type="text" placeholder=" . . . " id="emailSubject"></td>

				</tr>

				<tr>

					<td></td>
					
					<td><textarea id="emailMessage"> </textarea></td>

				</tr>

			</table>
			
		</div>



	</body>

</html>
