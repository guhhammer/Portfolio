[package]
name = "z_server"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.7"              # ✅ match what ed25519-dalek 1.0 expects
rand_core = "0.5"         # ✅ match ed25519-dalek dependency
ed25519-dalek = "1.0"
x25519-dalek = "1.1.0"
base64 = "0.21"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"